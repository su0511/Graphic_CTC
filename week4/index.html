<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #000;
    }
    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 24px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
    }
    figure {
      margin: 0;
      min-width: 0;
      width: min(100%, calc(100vh - 48px));
      width: min(100%, calc(100dvh - 48px));
      aspect-ratio: 1 / 1;
      justify-self: center;
      display: grid;
      place-items: center;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @media (max-width: 640px) {
      main { grid-template-columns: 1fr; gap: 16px; padding: 16px; }
      figure { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <figure><img src="Untitled.png" width="1080" height="1080" alt="Week 4 artwork 1"></figure>
    <figure><img src="donut.png" width="1100" height="1000" alt="Week 4 donut artwork"></figure>
  </main>
</body>
</html>
