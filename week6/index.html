<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>week6</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        color: #192a39;
        background: #f3f5f4;
        font-synthesis: none;
        --blue: #245de9;
        --muted: #73808c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid #89abff;
        outline-offset: 5px;
      }
      header {
        max-width: 1100px;
        margin: auto;
        padding: 30px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.12em;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        background: #192a39;
        color: white;
        width: 29px;
        height: 29px;
        border-radius: 8px;
        margin-right: 10px;
      }
      .label {
        font-size: 10px;
        letter-spacing: 0.16em;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--muted);
      }
      .status {
        font-size: 11px;
        color: #64756c;
      }
      .status:before {
        content: "●";
        color: #4e9b78;
        margin-right: 7px;
      }
      main {
        max-width: 780px;
        margin: 57px auto;
        padding: 0 24px;
      }
      .eyebrow {
        color: var(--blue);
        text-align: center;
      }
      h1 {
        text-align: center;
        font-size: clamp(32px, 6vw, 48px);
        letter-spacing: -0.055em;
        margin: 17px 0 12px;
        font-weight: 650;
      }
      .intro {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
        margin: 0 0 35px;
      }
      .panel {
        background: white;
        border: 1px solid #e3e8e7;
        border-radius: 22px;
        padding: 34px 40px;
        box-shadow: 0 15px 45px #243c3a06;
      }
      .panel-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .pill {
        font-size: 10px;
        background: #f0f4f7;
        border-radius: 20px;
        padding: 7px 10px;
        color: #70808e;
      }
      .volume {
        text-align: center;
        font-size: 82px;
        letter-spacing: -0.07em;
        font-weight: 500;
        margin: 25px 0 16px;
      }
      .volume span {
        font-size: 26px;
        vertical-align: top;
        display: inline-block;
        margin: 17px 0 0 7px;
        color: #9aa5ad;
      }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .speaker {
        width: 22px;
        color: #6d7c8a;
        flex-shrink: 0;
      }
      .slider {
        position: relative;
        flex: 1;
        height: 40px;
        cursor: ew-resize;
        touch-action: none;
      }
      .track,
      .fill {
        position: absolute;
        top: 17px;
        height: 6px;
        border-radius: 9px;
        left: 0;
        right: 0;
        background: #e8edf1;
      }
      .fill {
        right: auto;
        width: 50%;
        background: var(--blue);
      }
      .knob {
        position: absolute;
        left: 50%;
        top: 8px;
        width: 24px;
        height: 24px;
        border: 5px solid white;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 2px 8px #234a5740;
        transform: translateX(-50%);
        transition: left 0.3s;
      }
      .hint {
        text-align: center;
        font-size: 12px;
        color: #89949e;
        margin: 10px 0 27px;
      }
      .panel-bottom {
        border-top: 1px solid #edf0f2;
        padding-top: 21px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .quiet {
        background: none;
        border: 1px solid #e1e6ec;
        padding: 9px 13px;
        border-radius: 8px;
        font-size: 11px;
        color: #62717e;
      }
      .caption {
        font-size: 10px;
        color: #8a959e;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        margin: 25px 0;
        gap: 12px;
      }
      .stat {
        padding: 21px 12px;
        border: 1px solid #e2e7e6;
        border-radius: 12px;
        text-align: center;
      }
      .stat strong {
        display: block;
        font-size: 23px;
        font-weight: 550;
        margin-bottom: 7px;
      }
      .stat span {
        font-size: 10px;
        color: #7c8993;
      }
      .policy {
        display: flex;
        gap: 14px;
        padding: 19px 22px;
        border-radius: 12px;
        background: #eaf0ed;
        color: #66766e;
        font-size: 12px;
        line-height: 1.6;
      }
      .policy b {
        color: #42584b;
      }
      .policy p {
        margin: 0;
      }
      footer {
        text-align: center;
        font-size: 10px;
        color: #98a39e;
        margin: 40px 0;
        letter-spacing: 0.03em;
      }
      dialog {
        border: 1px solid #e0e6ed;
        border-radius: 19px;
        padding: 0;
        width: min(510px, calc(100% - 28px));
        color: #192a39;
        box-shadow: 0 25px 100px #14233a30;
      }
      dialog::backdrop {
        background: #182d4159;
        backdrop-filter: blur(6px);
      }
      .exam-head {
        padding: 23px 28px;
        border-bottom: 1px solid #e9edf1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .exam-title {
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.08em;
      }
      .exam-sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .timer {
        font-variant-numeric: tabular-nums;
        background: #eef3ff;
        color: var(--blue);
        padding: 10px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 650;
      }
      .urgent {
        color: #be3535;
        background: #fff0f0;
        animation: blink 0.7s infinite alternate;
      }
      @keyframes blink {
        to {
          opacity: 0.55;
        }
      }
      .time-track {
        height: 3px;
        background: #edf1f6;
      }
      .time-fill {
        height: 100%;
        background: var(--blue);
        width: 100%;
      }
      .exam-body {
        padding: 26px 28px;
      }
      .question {
        font-size: 23px;
        line-height: 1.4;
        margin: 14px 0 24px;
        letter-spacing: -0.025em;
      }
      .choices {
        display: grid;
        gap: 9px;
      }
      .choice {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        background: white;
        border: 1px solid #dce3eb;
        border-radius: 10px;
        padding: 13px;
        font-size: 15px;
        color: inherit;
      }
      .choice:hover:not(:disabled) {
        background: #f4f7ff;
        border-color: #8caaf4;
      }
      .letter {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: #f0f3f6;
        font-size: 11px;
        color: #6b7988;
      }
      .choice:disabled {
        cursor: default;
      }
      .choice.correct {
        background: #edf8f1;
        border-color: #68b78a;
      }
      .choice.wrong {
        background: #fff0f0;
        border-color: #df9797;
      }
      .feedback {
        border-radius: 9px;
        margin-top: 18px;
        padding: 15px;
        background: #f1f5ff;
        font-size: 13px;
        line-height: 1.7;
      }
      .feedback strong {
        display: block;
      }
      .exam-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 23px;
        font-size: 10px;
        color: var(--muted);
      }
      .primary {
        border: 0;
        background: var(--blue);
        color: white;
        padding: 11px 18px;
        border-radius: 8px;
        font-size: 12px;
      }
      .hidden {
        display: none;
      }
      .notice {
        font-size: 12px;
        color: #657486;
        text-align: center;
        min-height: 18px;
        margin-top: 18px;
      }
      @media (max-width: 520px) {
        header {
          padding: 22px 20px;
        }
        .status {
          display: none;
        }
        main {
          margin-top: 30px;
          padding: 0 18px;
        }
        .panel {
          padding: 25px 22px;
        }
        .stats {
          gap: 7px;
        }
        .stat {
          padding: 16px 5px;
        }
        .stat span {
          font-size: 9px;
        }
        .panel-bottom {
          flex-wrap: wrap;
        }
        .exam-body {
          padding: 22px;
        }
        .exam-head {
          padding: 20px 22px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

  <body>
    <header>
      <div class="brand"><span class="mark">V.</span>VOLUME DEPARTMENT</div>
      <span class="window-close" aria-hidden="true">×</span>
    </header>
    <main>
      <section class="panel" aria-label="Volume control">
        <div class="panel-top">
          <span class="label">Output volume</span
          ><span class="pill">STANDARD ACCESS</span>
        </div>
        <div class="volume"><output id="volume">50</output><span>%</span></div>
        <div class="slider-row">
          <svg
            class="speaker"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="M11 5 6 9H3v6h3l5 4z" />
          </svg>
          <div
            id="slider"
            class="slider"
            role="slider"
            tabindex="0"
            aria-label="Output volume. Adjusting requires a mathematics exam."
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="50"
          >
            <div class="track"></div>
            <div id="fill" class="fill"></div>
            <div id="knob" class="knob"></div>
          </div>
          <svg
            class="speaker"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="M10 5 5 9H2v6h3l5 4zM14 8q4 4 0 8m3-11q7 7 0 14" />
          </svg>
        </div>
        <p class="hint">Drag to adjust · One percent at a time</p>
        <div class="panel-bottom">
          <button class="quiet" id="tone" aria-pressed="false">
            ▶ Play preview tone</button
          ><span class="caption"
            >Volume adjustment is a privilege, not a right.</span
          >
        </div>
      </section>
      <div id="notice" class="notice" role="status" aria-live="polite">
        Your listening experience is in qualified hands. Probably.
      </div>
    </main>
    <dialog id="exam" aria-labelledby="exam-title" aria-describedby="exam-sub">
      <div class="exam-head">
        <div>
          <div class="exam-title" id="exam-title">VOLUME PROFICIENCY EXAM</div>
          <div class="exam-sub" id="exam-sub">
            Please demonstrate your right to adjust.
          </div>
        </div>
        <div
          class="timer"
          id="timer"
          role="timer"
          aria-label="Seconds remaining"
        >
          00:10
        </div>
      </div>
      <div class="time-track"><div class="time-fill" id="time-fill"></div></div>
      <div class="exam-body">
        <div class="label" id="category"></div>
        <h2 class="question" id="question"></h2>
        <div class="choices" id="choices"></div>
        <div class="feedback hidden" id="feedback" role="status"></div>
        <div class="exam-foot">
          <span id="request"></span
          ><button id="continue" class="primary hidden">Back to volume →</button
          ><span id="key-hint">Choose A–D or 1–4</span>
        </div>
      </div>
    </dialog>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const rand = (min, max) =>
        Math.floor(Math.random() * (max - min + 1)) + min;
      function makeQuestion() {
        const roll = Math.random(),
          a = rand(2, 12),
          b = rand(2, 9);
        let category, prompt, answer, explanation;
        if (roll < 0.4) {
          category = "Basic arithmetic";
          const op = rand(0, 2);
          answer = op === 0 ? a + b : op === 1 ? a * b : a - b;
          prompt = `${a} ${["+", "×", "−"][op]} ${b} = ?`;
          explanation = `${a} ${["+", "×", "−"][op]} ${b} = ${answer}.`;
        } else if (roll < 0.7) {
          category = "Algebra";
          const x = rand(-5, 12);
          answer = x;
          prompt = `Solve for x: ${a}x + ${b} = ${a * x + b}`;
          explanation = `Subtract ${b}, then divide by ${a}: x = ${x}.`;
        } else if (roll < 0.9) {
          category = "Advanced mathematics";
          if (Math.random() < 0.5) {
            const base = rand(2, 5),
              power = rand(2, 4);
            answer = power;
            prompt = `log${{ 2: "₂", 3: "₃", 4: "₄", 5: "₅" }[base]}(${base ** power}) = ?`;
            explanation = `${base} raised to ${power} equals ${base ** power}.`;
          } else {
            const n = rand(3, 10);
            answer = (n * (n + 1)) / 2;
            prompt = `Evaluate ∑ k for k = 1 to ${n}.`;
            explanation = `The sum is n(n + 1)/2 = ${n} × ${n + 1}/2 = ${answer}.`;
          }
        } else {
          category = "Calculus";
          if (Math.random() < 0.5) {
            const x = rand(1, 5);
            answer = 2 * a * x;
            prompt = `If f(x) = ${a}x², what is f′(${x})?`;
            explanation = `f′(x) = ${2 * a}x, so f′(${x}) = ${answer}.`;
          } else {
            const upper = rand(1, 5);
            answer = a * upper * upper;
            prompt = `Evaluate ∫₀${{ 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵" }[upper]} ${2 * a}x dx.`;
            explanation = `An antiderivative is ${a}x². Evaluate at ${upper} and 0 to get ${answer}.`;
          }
        }
        const options = new Set([answer]);
        while (options.size < 4) options.add(answer + rand(-10, 10));
        const choices = [...options];
        for (let i = choices.length - 1; i > 0; i--) {
          const j = rand(0, i);
          [choices[i], choices[j]] = [choices[j], choices[i]];
        }
        return { category, prompt, answer, explanation, choices };
      }
      let volume = 50,
        direction = 1,
        question = null,
        active = false,
        deadline = 0,
        ticker = null,
        attempts = 0,
        passed = 0,
        streak = 0;
      let audioContext,
        oscillator,
        gain,
        playing = false;
      function render() {
        $("volume").textContent = volume;
        $("slider").setAttribute("aria-valuenow", volume);
        $("fill").style.width = volume + "%";
        $("knob").style.left = volume + "%";
        if (gain)
          gain.gain.setTargetAtTime(
            playing ? (volume / 100) * 0.12 : 0,
            audioContext.currentTime,
            0.06,
          );
      }
      function tick() {
        if (!active) return;
        const remaining = Math.max(0, deadline - performance.now());
        $("timer").textContent =
          "00:" + String(Math.ceil(remaining / 1000)).padStart(2, "0");
        $("timer").classList.toggle("urgent", remaining <= 3000);
        $("time-fill").style.width = remaining / 100 + "%";
        if (remaining <= 0) finish(null);
      }
      function start(dir) {
        if ($("exam").open) return;
        direction = dir;
        if ((volume === 0 && dir < 0) || (volume === 100 && dir > 0)) {
          $("notice").textContent =
            `Already at ${volume}%. Try the other direction.`;
          return;
        }
        question = makeQuestion();
        active = true;
        $("category").textContent =
          question.category + " / 10-second assessment";
        $("question").textContent = question.prompt;
        $("request").textContent =
          `REQUEST: ${dir > 0 ? "INCREASE" : "DECREASE"} VOLUME BY 1%`;
        $("feedback").classList.add("hidden");
        $("continue").classList.add("hidden");
        $("key-hint").classList.remove("hidden");
        $("choices").replaceChildren();
        question.choices.forEach((value, i) => {
          const button = document.createElement("button");
          button.className = "choice";
          const letter = document.createElement("span");
          letter.className = "letter";
          letter.textContent = "ABCD"[i];
          const label = document.createElement("span");
          label.textContent = value;
          button.append(letter, label);
          button.addEventListener("click", () => finish(value));
          $("choices").append(button);
        });
        deadline = performance.now() + 10000;
        $("exam").showModal();
        tick();
        ticker = setInterval(tick, 40);
      }
      function finish(value) {
        if (!active) return;
        const timeout = performance.now() >= deadline;
        active = false;
        clearInterval(ticker);
        const correct = !timeout && value === question.answer;
        const before = volume;
        attempts++;
        if (correct) {
          volume = Math.max(0, Math.min(100, volume + direction));
          passed++;
          streak++;
        } else {
          const draw = rand(0, 99);
          volume = draw >= before ? draw + 1 : draw;
          streak = 0;
        }
        [...$("choices").children].forEach((button, i) => {
          button.disabled = true;
          if (question.choices[i] === question.answer)
            button.classList.add("correct");
          else if (!timeout && question.choices[i] === value)
            button.classList.add("wrong");
        });
        $("timer").classList.remove("urgent");
        if (timeout) {
          $("timer").textContent = "00:00";
          $("time-fill").style.width = "0%";
        }
        const title = correct
          ? "Approved. A whole 1%."
          : timeout
            ? "Time expired. Authority revoked."
            : "Incorrect. We’ll take it from here.";
        const detail = correct
          ? `Volume ${direction > 0 ? "increased" : "decreased"} from ${before}% to ${volume}%. Only another exam stands between you and progress.`
          : `Volume randomly reassigned: ${before}% → ${volume}%. ${question.explanation}`;
        $("feedback").replaceChildren();
        const strong = document.createElement("strong");
        strong.textContent = title;
        $("feedback").append(strong, document.createTextNode(detail));
        $("feedback").classList.remove("hidden");
        $("continue").classList.remove("hidden");
        $("key-hint").classList.add("hidden");
        $("notice").textContent = title + " Volume: " + volume + "%.";
        render();
        $("continue").focus();
      }
      let pendingPointer = null;
      $("slider").addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        const box = $("slider").getBoundingClientRect(),
          thumb = box.left + (box.width * volume) / 100;
        if (Math.abs(event.clientX - thumb) <= 14) {
          pendingPointer = { id: event.pointerId, x: event.clientX };
          $("slider").setPointerCapture(event.pointerId);
        } else start(event.clientX > thumb ? 1 : -1);
      });
      $("slider").addEventListener("pointermove", (event) => {
        if (
          !pendingPointer ||
          event.pointerId !== pendingPointer.id ||
          Math.abs(event.clientX - pendingPointer.x) < 2
        )
          return;
        const dir = event.clientX > pendingPointer.x ? 1 : -1;
        pendingPointer = null;
        $("slider").releasePointerCapture(event.pointerId);
        start(dir);
      });
      $("slider").addEventListener("pointerup", (event) => {
        if (!pendingPointer || event.pointerId !== pendingPointer.id) return;
        pendingPointer = null;
        start(volume === 100 ? -1 : 1);
      });
      $("slider").addEventListener("pointercancel", () => {
        pendingPointer = null;
      });
      $("slider").addEventListener("keydown", (event) => {
        const up = ["ArrowRight", "ArrowUp", "PageUp", "End"],
          down = ["ArrowLeft", "ArrowDown", "PageDown", "Home"];
        if (up.includes(event.key) || down.includes(event.key)) {
          event.preventDefault();
          start(up.includes(event.key) ? 1 : -1);
        }
      });
      $("exam").addEventListener("cancel", (event) => event.preventDefault());
      $("exam").addEventListener("keydown", (event) => {
        if (
          !active ||
          event.repeat ||
          event.altKey ||
          event.ctrlKey ||
          event.metaKey
        )
          return;
        const key = event.key.toLowerCase(),
          index =
            "abcd".includes(key) && key.length === 1
              ? "abcd".indexOf(key)
              : "1234".includes(key) && key.length === 1
                ? "1234".indexOf(key)
                : -1;
        if (index >= 0) {
          event.preventDefault();
          finish(question.choices[index]);
        }
      });
      $("continue").addEventListener("click", () => {
        $("exam").close();
        $("slider").focus();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) tick();
      });
      $("tone").addEventListener("click", async () => {
        try {
          if (!audioContext) {
            audioContext = new (
              window.AudioContext || window.webkitAudioContext
            )();
            gain = audioContext.createGain();
            gain.gain.value = 0;
            oscillator = audioContext.createOscillator();
            oscillator.frequency.value = 220;
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start();
          }
          await audioContext.resume();
          playing = !playing;
          $("tone").textContent = playing
            ? "Ⅱ Stop preview tone"
            : "▶ Play preview tone";
          $("tone").setAttribute("aria-pressed", playing);
          render();
        } catch {
          $("notice").textContent =
            "Audio preview is unavailable in this browser. The exam still works.";
        }
      });
      render();
    </script>
  </body>
</html>
